<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitten Village</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="title-chip">Kitten Village</div>
      <button id="jump-btn" aria-label="jump">⬆<span class="jump-label">jump</span></button>
      <div class="controls-card">
        <span class="ctl"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>←→↑↓</kbd> move</span>
        <span class="ctl"><kbd>Space</kbd> jump</span>
        <span class="ctl"><kbd>E</kbd> talk</span>
        <span class="ctl"><kbd>I</kbd> enter/exit</span>
        <span class="ctl"><kbd>T</kbd> tilt</span>
        <span class="ctl">📱 tap to move &amp; interact</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
